services:
  postgres:
    image: postgres:16-alpine
    container_name: indusscript-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-indusscript_ai}
      POSTGRES_USER: ${POSTGRES_USER:-indusscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indusscript_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - indusscript_ai_postgres_data:/var/lib/postgresql/data
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  indusscript_ai_postgres_data:
